# Hardware profile: Raspberry Pi 3 B+ deployment target.
#
# Real drivetrain + onboard-IMU + battery plugins on the shared Yahboom board
# driver. The ADXL345 safety accel, LIDAR, and camera plugins land separately.
rov2_core:
  ros__parameters:
    loop_rate_hz: 20.0
    cmd_vel_timeout_sec: 0.5
    autostart: true
    use_sim_time: false
    sensor_plugins: ["rov2_plugins::NavImu", "rov2_plugins::Battery"]
    actuator_plugins: ["rov2_plugins::Drivetrain"]
    brain_plugins: ["rov2_plugins::NoopBrain"]

    # All three plugins share ONE Yahboom serial connection (see YahboomBoard).
    drivetrain:
      device: "/dev/myserial"      # stable udev symlink -> motor board (1a86:7523)
      # Phase-1 OPEN-LOOP gains: map normalized v, omega to motor units [-100,100].
      # These are UNCALIBRATED. Replace with real kinematics once wheel geometry,
      # encoder counts-per-rev, and max speeds are bench-measured.
      lin_scale: 60.0
      ang_scale: 40.0
      max_motor: 100
      invert_left: false
      invert_right: false
      # Which of the board's four motor channels (m1..m4) are left vs right.
      # Defaults are a best guess; confirm on the bench (slow, wheels off ground).
      left_motor_ids: [1, 3]
      right_motor_ids: [2, 4]

    nav_imu:
      device: "/dev/myserial"
      frame_id: "imu_link"
      topic: "/imu/data"

    battery:
      device: "/dev/myserial"
      topic: "/battery"
